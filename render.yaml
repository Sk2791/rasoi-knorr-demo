services:
  - type: web
    name: rasoi-knorr-demo
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
    # The free plan's filesystem does not survive a redeploy, so rasoi.db
    # (and everything in it — History, banners, presets) resets each time
    # you push a change. To make it persistent:
    #   1. Upgrade this service to a paid instance type (disks require one).
    #   2. Uncomment the "disk" block below and redeploy.
    #   3. Add an env var DB_PATH=/data/rasoi.db in the Render dashboard.
    # disk:
    #   name: rasoi-data
    #   mountPath: /data
    #   sizeGB: 1
